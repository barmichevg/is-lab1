<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Операции — Реестр</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#main">К содержимому</a>
<header class="app-header">
    <a class="brand" href="index.html">Информационные системы · Лабораторная работа № 1</a>
    <nav aria-label="Основная навигация">
        <a href="index.html">Организации</a>
        <a href="special.html" class="active" aria-current="page">Операции</a>
        <a href="references.html">Справочники</a>
    </nav>
    <div class="session-tools"><span id="sessionUser" class="session-user"></span></div>
</header>
<main id="main" class="workspace">
<section class="page-heading">
    <h1>Операции</h1>
    <div id="connectionSlot"></div>
</section>
<div id="globalError" class="error" role="alert"></div>
<div class="grid">
    <section class="card">
        <h2>Минимум сотрудников</h2>
        <button type="button" class="primary" onclick="minEmployees()">Найти организацию</button>
    </section>

    <section class="card">
        <h2>Поиск по началу названия</h2>
        <label>Начало названия
            <input id="prefix" placeholder="Например: ИТМО">
        </label>
        <div class="card-actions"><button type="button" class="primary" onclick="nameStartsWith()">Найти организации</button></div>
    </section>

    <section class="card">
        <h2>Поиск по типу выше заданного</h2>
        <label>Тип организации
            <select id="typeValue">
                <option value="COMMERCIAL">Коммерческая</option>
                <option value="GOVERNMENT">Государственная</option>
                <option value="PRIVATE_LIMITED_COMPANY">ООО</option>
            </select>
        </label>
        <div class="card-actions"><button type="button" class="primary" onclick="typeGreaterThan()">Показать организации</button></div>
    </section>

    <section class="card">
        <h2>Добавление сотрудника</h2>
        <label>Организация
            <select id="employeeOrg"></select>
        </label>
        <div class="card-actions"><button type="button" class="primary" onclick="addEmployee()">Добавить сотрудника</button></div>
    </section>

    <section class="card wide">
        <h2>Объединение организаций</h2>
        <div class="fields">
            <h3 class="full">Исходные организации</h3>
            <label>Первая организация <select id="mergeFirst"></select></label>
            <label>Вторая организация <select id="mergeSecond"></select></label>
            <label class="full">Название новой организации <input id="mergeName" placeholder="Название после объединения"></label>
        </div>
        <div class="fields">
            <h3 class="full">Официальный адрес</h3>
            <label class="full">Источник адреса
                <select id="mergeAddressMode" onchange="syncAddressMode()">
                    <option value="existing">Выбрать существующий адрес</option>
                    <option value="new">Создать новый адрес</option>
                </select>
            </label>
        </div>

        <div id="existingAddressBlock" class="fields">
            <label class="full">Адрес из справочника <select id="mergeExistingAddress"></select></label>
        </div>

        <div id="newAddressBlock" class="fields hidden">
            <label class="full">Почтовый индекс <input id="mergeZip" placeholder="Можно оставить пустым"></label>
            <label class="full">Город
                <select id="mergeTownMode" onchange="syncTownMode()">
                    <option value="existing">Выбрать существующий город</option>
                    <option value="new">Создать новый город</option>
                </select>
            </label>
            <div id="existingTownBlock" class="full">
                <label>Город из справочника <select id="mergeExistingTown"></select></label>
            </div>
            <div id="newTownBlock" class="fields full hidden">
                <label>Название города <input id="mergeTownName"></label>
                <label>Координата X <input id="mergeTownX" type="number" step="any"></label>
                <label>Координата Y <input id="mergeTownY" type="number" step="any"></label>
                <label>Координата Z <input id="mergeTownZ" type="number" step="1"></label>
            </div>
        </div>
        <div class="card-actions"><button type="button" class="primary" onclick="mergeOrganizations()">Объединить организации</button></div>
    </section>
</div>
</main>

<script src="app.js"></script>
<script src="operations.js"></script></body></html>
