<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Реестр</title><link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
<a class="skip-link" href="#main">К форме входа</a>
<header class="app-header">
    <a class="brand" href="index.html">Информационные системы · Лабораторная работа № 1</a>
</header>
<main id="main" class="auth-main" aria-label="Вход и регистрация">
    <div class="auth-box panel">
        <div class="tabs" role="tablist" aria-label="Действие">
            <button id="loginTab" role="tab" aria-selected="true" aria-controls="authPanel" type="button">Вход</button>
            <button id="registerTab" role="tab" aria-selected="false" aria-controls="authPanel" tabindex="-1" type="button">Регистрация</button>
        </div>
        <div id="authPanel" role="tabpanel" aria-labelledby="loginTab">
            <form id="login">
                <label>Логин<input name="username" autocomplete="username" required maxlength="64" pattern="[A-Za-z0-9_.\-]+" placeholder="Ваш логин" aria-describedby="usernameHint"><small id="usernameHint" hidden>Латинские буквы, цифры, точка, дефис и подчёркивание.</small></label>
                <label>Пароль<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ваш пароль"></label>
                <label id="repeatLabel" hidden>Повторите пароль<input id="repeatPassword" type="password" autocomplete="new-password" disabled placeholder="Ещё раз тот же пароль"></label>
                <button id="submit" class="primary" type="submit">Войти</button>
                <p id="error" class="error" role="alert"></p>
            </form>
        </div>
    </div>
</main>
<script src="login.js"></script>
</body></html>
